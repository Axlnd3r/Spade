[package]
name = "appraiser"
description = "TAKSIR enclave: reads {\"data\": ...} on stdin, asks NEAR AI Cloud for a price, writes JSON <= 900 bytes"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Axlnd3r/Spade"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "appraiser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
